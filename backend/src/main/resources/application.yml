spring:
  modulith:
    detection-strategy: explicitly-annotated
    events:
      republish-outstanding-events-on-restart: true
  application:
    name: fundpilot-backend
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fundpilot}
    username: ${DB_USERNAME:fundpilot}
    password: ${DB_PASSWORD:fundpilot}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    # SMTP 未配置时主体功能不受影响,提醒记录为 FAILED。
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      # 465 等 SSL 直连端口需置 true(此时 starttls 不生效)
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # prometheus:保留指标导出端点供外部抓取;Prometheus/Grafana 抓取栈不随应用部署
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # SMTP 是可选能力:其可达性不应影响 /actuator/health(否则部署健康检查会被外部邮件服务抖动带崩)
      enabled: false

fundpilot:
  auth:
    bootstrap:
      username: ${FUNDPILOT_BOOTSTRAP_USERNAME:}
      password: ${FUNDPILOT_BOOTSTRAP_PASSWORD:}
    login:
      max-attempts: ${FUNDPILOT_AUTH_LOGIN_MAX_ATTEMPTS:5}
      window: ${FUNDPILOT_AUTH_LOGIN_WINDOW:PT1M}
      max-entries: ${FUNDPILOT_AUTH_LOGIN_MAX_ENTRIES:10000}
      # 仅配置明确可信的反向代理地址后才读取 X-Forwarded-For。
      trusted-proxies: ${FUNDPILOT_AUTH_TRUSTED_PROXIES:}
  deployment:
    # 候选发布阶段关闭定时任务与启动写监听器；正常运行必须为 false。
    validation-mode: ${DEPLOYMENT_VALIDATION_MODE:false}
  admin:
    # 迁移期兼容管理密钥；用户名密码会话不依赖此配置。
    api-key: ${ADMIN_API_KEY:}
    # Cookie 签名密钥；未配置时兼容回退 ADMIN_API_KEY，生产应单独设置。
    session-secret: ${FUNDPILOT_SESSION_SECRET:}
  yangjibao:
    base-url: ${YANGJIBAO_BASE_URL:http://browser-plug-api.yangjibao.com}
    secret: ${YANGJIBAO_SECRET:}
    session-ttl: ${YANGJIBAO_SESSION_TTL:PT30M}
    session-retention: ${YANGJIBAO_SESSION_RETENTION:P7D}
    timeout: ${YANGJIBAO_TIMEOUT:PT15S}
  alerting:
    # 关闭后不注册价格提醒评估任务;规则与历史仍可读写。
    enabled: ${FUNDPILOT_ALERTING_ENABLED:true}
    # 每交易日评估时点(Asia/Shanghai);每条规则每个交易日最多成功发送 1 次。
    evaluation-cron: "${FUNDPILOT_ALERTING_EVALUATION_CRON:0 30 14 * * MON-FRI}"
    # 发件人;默认与 SMTP 账号一致(QQ 等要求发件人等于认证账号),留空表示未配置邮件服务。
    mail-from: ${MAIL_FROM:${MAIL_USERNAME:}}
    # 提醒邮件正文里的详情链接前缀。
    app-base-url: ${FUNDPILOT_APP_BASE_URL:http://localhost:5173}
