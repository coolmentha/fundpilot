spring:
  application:
    name: fundpilot-backend
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fundpilot}
    username: ${DB_USERNAME:fundpilot}
    password: ${DB_PASSWORD:fundpilot}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # prometheus:供 fundpilot_default 网络内 Prometheus 抓取(backend 不映射宿主端口,公网不可达)
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

fundpilot:
  deployment:
    # 候选发布阶段关闭定时任务与启动写监听器；正常运行必须为 false。
    validation-mode: ${DEPLOYMENT_VALIDATION_MODE:false}
  admin:
    # 所有业务 API 失败关闭；生产必须通过环境变量注入，禁止提供默认密钥。
    api-key: ${ADMIN_API_KEY:}
  flyway:
    # 仅允许修复 VPS 已知的遗留 V7 Missing 记录；未命中时仍执行严格校验。
    legacy-v7-repair:
      enabled: ${FLYWAY_REPAIR_LEGACY_V7:false}
  yangjibao:
    base-url: ${YANGJIBAO_BASE_URL:http://browser-plug-api.yangjibao.com}
    secret: ${YANGJIBAO_SECRET:YxmKSrQR4uoJ5lOoWIhcbd7SlUEh9OOc}
    session-ttl: ${YANGJIBAO_SESSION_TTL:PT30M}
    timeout: ${YANGJIBAO_TIMEOUT:PT15S}
