spring:
  modulith:
    detection-strategy: explicitly-annotated
    events:
      republish-outstanding-events-on-restart: true
  application:
    name: fundpilot-backend
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fundpilot}
    username: ${DB_USERNAME:fundpilot}
    password: ${DB_PASSWORD:fundpilot}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # prometheus:供 fundpilot_default 网络内 Prometheus 抓取(backend 不映射宿主端口,公网不可达)
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

fundpilot:
  investment-plan-scheduler:
    # true 使用 InvestmentPlan + Accounting 新链路；false 仅在回切时恢复 legacy DCA 调度器。
    enabled: ${INVESTMENT_PLAN_SCHEDULER_ENABLED:true}
  auth:
    bootstrap:
      username: ${FUNDPILOT_BOOTSTRAP_USERNAME:}
      password: ${FUNDPILOT_BOOTSTRAP_PASSWORD:}
    login:
      max-attempts: ${FUNDPILOT_AUTH_LOGIN_MAX_ATTEMPTS:5}
      window: ${FUNDPILOT_AUTH_LOGIN_WINDOW:PT1M}
      max-entries: ${FUNDPILOT_AUTH_LOGIN_MAX_ENTRIES:10000}
      # 仅配置明确可信的反向代理地址后才读取 X-Forwarded-For。
      trusted-proxies: ${FUNDPILOT_AUTH_TRUSTED_PROXIES:}
  deployment:
    # 候选发布阶段关闭定时任务与启动写监听器；正常运行必须为 false。
    validation-mode: ${DEPLOYMENT_VALIDATION_MODE:false}
  admin:
    # 迁移期兼容管理密钥；用户名密码会话不依赖此配置。
    api-key: ${ADMIN_API_KEY:}
    # Cookie 签名密钥；未配置时兼容回退 ADMIN_API_KEY，生产应单独设置。
    session-secret: ${FUNDPILOT_SESSION_SECRET:}
  flyway:
    # 仅允许修复 VPS 已知的遗留 V7 Missing 记录；未命中时仍执行严格校验。
    legacy-v7-repair:
      enabled: ${FLYWAY_REPAIR_LEGACY_V7:false}
  yangjibao:
    base-url: ${YANGJIBAO_BASE_URL:http://browser-plug-api.yangjibao.com}
    secret: ${YANGJIBAO_SECRET:}
    session-ttl: ${YANGJIBAO_SESSION_TTL:PT30M}
    timeout: ${YANGJIBAO_TIMEOUT:PT15S}
